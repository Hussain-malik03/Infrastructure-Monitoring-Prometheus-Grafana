# =====================================================================
# Infrastructure alert rules
# Metric names target windows_exporter >= 0.30. For older versions see
# the commented alternatives.
# =====================================================================
groups:

- name: availability
  rules:
  - alert: TargetDown
    expr: up == 0
    for: 2m
    labels: { severity: critical }
    annotations:
      summary: "{{ $labels.instance }} ({{ $labels.job }}) is not responding"
      description: "Prometheus has failed to scrape {{ $labels.instance }} for 2 minutes. Host or exporter is down."

- name: windows-hosts
  rules:
  - alert: HighCPU
    expr: 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100) > 90
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "CPU above 90% on {{ $labels.instance }}"
      description: "Average CPU has been {{ $value | printf \"%.1f\" }}% for 10 minutes."

  # SQL Server deliberately holds most of the RAM, so DB hosts are excluded
  # here and covered by the SQL memory-pressure rule instead.
  - alert: HighMemory
    expr: |
      100 * (1 - windows_memory_available_bytes{role!="db"}
                 / windows_memory_physical_total_bytes{role!="db"}) > 90
    # older exporters: 100 * (1 - windows_os_physical_memory_free_bytes / windows_os_visible_memory_bytes)
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "Memory above 90% on {{ $labels.instance }}"
      description: "Memory usage has been {{ $value | printf \"%.1f\" }}% for 10 minutes."

  - alert: LowDiskSpace
    expr: |
      100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"}
          / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"} < 10
    for: 5m
    labels: { severity: warning }
    annotations:
      summary: "Drive {{ $labels.volume }} on {{ $labels.instance }} below 10% free"
      description: "Only {{ $value | printf \"%.1f\" }}% free. Backups, logs and deployments may fail."

  - alert: CriticalDiskSpace
    expr: |
      100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"}
          / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"} < 5
    for: 2m
    labels: { severity: critical }
    annotations:
      summary: "Drive {{ $labels.volume }} on {{ $labels.instance }} below 5% free"

- name: redis
  rules:
  - alert: RedisDown
    expr: redis_up == 0
    for: 1m
    labels: { severity: critical }
    annotations:
      summary: "Redis on {{ $labels.instance }} is down"

- name: rabbitmq
  rules:
  - alert: RabbitMQResourceAlarm
    expr: rabbitmq_alarms_memory_used_watermark == 1 or rabbitmq_alarms_free_disk_space_watermark == 1
    for: 1m
    labels: { severity: critical }
    annotations:
      summary: "RabbitMQ resource alarm on {{ $labels.instance }}"
      description: "Memory or disk watermark reached. Publishers are being blocked."

  - alert: RabbitMQQueueBacklog
    expr: sum by (instance, queue) (rabbitmq_detailed_queue_messages_ready) > 1000
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "Queue {{ $labels.queue }} on {{ $labels.instance }} has {{ $value }} messages waiting"
      description: "Consumers are not keeping up or have stopped."

  - alert: RabbitMQQueueNoConsumers
    expr: sum by (instance, queue) (rabbitmq_detailed_queue_consumers) == 0
    for: 5m
    labels: { severity: warning }
    annotations:
      summary: "Queue {{ $labels.queue }} on {{ $labels.instance }} has no consumers"
